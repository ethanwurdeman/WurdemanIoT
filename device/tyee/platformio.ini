[env:tyee]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
  -I ../../config
  -I include
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
  vshymanskyy/TinyGSM @ ^0.12.0
  lewisxhe/XPowersLib @ ^0.2.5
  WiFi
